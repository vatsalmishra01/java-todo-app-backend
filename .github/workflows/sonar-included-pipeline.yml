name: Advanced CI Pipeline - Backend

on:
  push:
    branches:
      - develop
      - 'feature/*'
      - 'ci/*'
  pull_request:
    branches:
      - develop
      - main
  schedule:
    - cron: '30 11 * * 3,5'   # Wed & Fri 5 PM IST

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Project
        run: mvn clean install

      # ---------------- SONARCLOUD (ASSIGNMENT REQUIREMENT) ----------------
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=vatsalmishra01_java-todo-app-backend
            -Dsonar.organization=vatsalmishra01
            -Dsonar.host.url=https://sonarcloud.io

      # ---------------- TEST ----------------
      - name: Run Unit Tests
        run: mvn test
        continue-on-error: true

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit

      # ---------------- COVERAGE ----------------
      - name: Generate Code Coverage
        run: mvn jacoco:report

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_number }}
          path: target/site/jacoco

      # ---------------- FAILURE LOG ----------------
      - name: Check Test Result
        if: failure()
        run: echo "Tests failed but pipeline continues"

      # ---------------- ARTIFACT ----------------
      - name: Upload Versioned Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.run_number }}-${{ github.sha }}
          path: target/*.jar

      # ---------------- EMAIL ----------------
      - name: Send Email Notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Build Failed - GitHub Actions"
          body: |
            The build has failed.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitHub Actions

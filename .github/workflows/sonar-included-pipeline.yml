name: Advanced CI Pipeline - Backend

on:
  push:
    branches:
      - develop
      - 'feature/*'
      - 'ci/*'
  pull_request:
    branches:
      - develop
      - main
  schedule:
    - cron: '30 11 * * 3,5'

permissions:
  contents: read
  checks: write

jobs:

  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Project
        run: mvn clean install

      - name: Run Unit Tests
        run: mvn test
        continue-on-error: true

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit

      - name: Generate Code Coverage
        run: mvn jacoco:report

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_number }}
          path: target/site/jacoco

      - name: Check Test Result
        if: failure()
        run: echo "Tests failed but pipeline continues"

      - name: Upload Versioned Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.run_number }}-${{ github.sha }}
          path: target/*.jar

      - name: Send Email Notification (Build)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Build Failed - CI Pipeline"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            Build Failed!

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            Logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}


  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: SonarCloud Scan
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=vatsalmishra01_java-todo-app-backend \
            -Dsonar.organization=vatsalmishra01 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Send Email Notification (Sonar)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Sonar Analysis Failed"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            Sonar Analysis Failed!

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            Logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

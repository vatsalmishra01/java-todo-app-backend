name: CI Pipeline - Backend

on:
  push:
    branches:
      - develop
      - 'feature/*'
      - 'ci/*'
  pull_request:
    branches:
      - develop
      - main
      - 'ci/*'
  schedule:
    - cron: '30 11 * * 3,5'   # Wed & Fri 5 PM I

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Project
        run: mvn clean install

      - name: Run Tests
        run: mvn test

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: target/*.jar

name: JFrog Included Pipeline (Final)

# ------------------------------------------------------------
# Triggers
# ------------------------------------------------------------
on:
  push:
    branches:
      - develop
      - 'feature/*'
      - 'ci/*'
  pull_request:
    branches:
      - develop
      - main
  schedule:
    - cron: '30 11 * * 3,5'

# ------------------------------------------------------------
# Permissions
# ------------------------------------------------------------
permissions:
  contents: read
  checks: write

jobs:

  # ------------------------------------------------------------
  # Build Job: Compile, Test, Coverage, Artifact Generation
  # ------------------------------------------------------------
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Project
        run: mvn clean install

      - name: Run Unit Tests
        run: mvn test
        continue-on-error: true

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit

      - name: Generate Code Coverage
        run: mvn jacoco:report

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_number }}
          path: target/site/jacoco

      - name: Check Test Result
        if: failure()
        run: echo "Tests failed but pipeline continues"

      - name: Upload Versioned Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.run_number }}-${{ github.sha }}
          path: target/*.jar

  # ------------------------------------------------------------
  # Sonar Job: Code Quality Analysis and Quality Gate Enforcement
  # ------------------------------------------------------------
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: SonarCloud Scan
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=vatsalmishra01_java-todo-app-backend \
            -Dsonar.organization=vatsalmishra01 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      

  # ------------------------------------------------------------
  # Artifactory Job: Upload Artifact Only If Quality Passes
  # ------------------------------------------------------------
  artifactory:
    name: Upload to Artifactory
    runs-on: ubuntu-latest
    needs: sonar

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ github.run_number }}-${{ github.sha }}

      - name: Upload to Artifactory
        run: |
          curl -u ${{ secrets.ARTIFACTORY_USER }}:${{ secrets.ARTIFACTORY_PASSWORD }} \
          -T *.jar \
          "${{ secrets.ARTIFACTORY_URL }}/my-repo/backend-${{ github.run_number }}-${{ github.sha }}.jar"

  # ------------------------------------------------------------
  # Notification Job: Centralized Failure Handling
  # ------------------------------------------------------------
  notify:
    name: Failure Notification
    runs-on: ubuntu-latest
    needs: [build, sonar, artifactory]
    if: failure()

    steps:
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CI Pipeline Failed"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            Pipeline Failed!

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            Logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

